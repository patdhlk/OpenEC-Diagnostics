version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All Avalonia.* versions must move together or the app fails to load.
      avalonia:
        patterns:
          - "Avalonia*"
      # Ditto for the EtherCAT SDK packages this project is built on.
      dahlke:
        patterns:
          - "Dahlke.*"
      test-stack:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
