name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Avalonia 12's XAML source generator needs Roslyn >= 4.14 (the .NET 10 SDK);
      # the .NET 8 runtime is kept so the net8.0 test assemblies still execute.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # SharpPcap needs the native wpcap runtime even to read a capture file offline.
      # ubuntu and macOS ship libpcap; Windows does not, so install Npcap. 0.96 is the
      # last public build with a silent installer — the method SharpPcap's own CI uses.
      - name: Install Npcap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\npcap.exe"
          Invoke-WebRequest "https://github.com/secdev/secdev.github.io/raw/refs/heads/master/public/ci/npcap-0.96.exe" -UseBasicParsing -OutFile $exe
          $sum = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne "83667e1306fdcf7f9967c10277b36b87e50ee8812e1ee2bb9443bdd065dc04a1") { throw "Npcap checksum mismatch: $sum" }
          Start-Process $exe -ArgumentList "/loopback_support=yes /winpcap_mode /S" -Wait

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      # Warnings are errors in CI so the tree stays clean for contributors.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The suite needs no hardware, no network, and no capture permissions:
      # every case either uses a checked-in capture or synthesises frames.
      - name: Test
        run: >-
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults
          retention-days: 7

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify formatting
        run: dotnet format --verify-no-changes
